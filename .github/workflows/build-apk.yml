
name: Build Industrial Galaxy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        id: find_project
        shell: bash
        run: |
          echo "Searching for Android project..."

          SETTINGS=$(find . -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found."
            echo "Repository contents:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Found project in: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build Android APK
        shell: bash
        run: |
          cd "${{ steps.find_project.outputs.project_dir }}"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "ERROR: gradlew is missing."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Industrial-Galaxy-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
